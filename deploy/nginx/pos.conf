# Nginx untuk EC2 backend Toko Maju POS.
# Salin ke /etc/nginx/sites-available/pos.conf lalu symlink ke sites-enabled/.
#
# Frontend TIDAK disajikan dari sini; frontend ada di S3 + CloudFront.
# Nginx hanya menerima /api/* dari ALB (atau langsung saat mode tanpa ALB).

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;

    # Health check lokal untuk troubleshooting.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Semua request API diteruskan ke Gunicorn di localhost.
    # Gunicorn TIDAK boleh listen di 0.0.0.0:8000.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Selain /api dan /health, tidak ada yang dilayani dari EC2.
    location / {
        default_type text/plain;
        return 404 "Not found. Frontend is served from CloudFront.\n";
    }
}
